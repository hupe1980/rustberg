# Rustberg configuration. Copy to rustberg.toml and adjust.
# Searched in order: ./rustberg.toml, /etc/rustberg/config.toml, ./config/rustberg.toml
# Every setting: https://hupe1980.github.io/rustberg/docs/configuration/

# ── Server ───────────────────────────────────────────────────────────────────
[server]
host = "0.0.0.0"
port = 8000

# Proxies whose X-Forwarded-For is believed. Empty: the TCP peer is the caller.
# This one address feeds rate limiting, `context.source_ip` and the audit record.
# trusted_proxies = ["10.0.0.0/8"]

# Keep serving this long after SIGTERM, so a load balancer stops routing first.
# shutdown_delay_seconds = 5

# The web console at /ui. It holds no privilege: every request is authorized
# like any client's.
[server.ui]
enabled = true

# ── Authentication ───────────────────────────────────────────────────────────
[server.auth]
api_key_enabled = true

# A key is the principal Rustberg::ApiKey::"<name>". The secret comes from the
# environment; unset or empty is a startup failure. Two entries with one name are
# one principal with two secrets — that is how a key is rotated.
# [[server.auth.api_keys]]
# name    = "ci-pipeline"
# tenant  = "acme"
# roles   = ["writer"]
# key_env = "RUSTBERG_KEY_CI"

# OIDC / JWT: the path for people and workloads, and for revocation without a restart.
# jwt_enabled = true
# [server.auth.jwt]
# issuer    = "https://auth.example.com"   # discovered via .well-known
# audiences = ["rustberg"]                 # one per client application; never empty
# jwks_url  = "https://auth.example.com/.well-known/jwks.json"   # skips discovery
# tenant_claim = "tenant_id"               # dotted paths reach nested claims
# roles_claim  = "realm_access.roles"
# oauth2_server_uri = "https://auth.example.com/oauth/token"     # advertised in /v1/config

# Cedar policy file. Replaces the built-in defaults; they are not merged.
# policy_file = "/etc/rustberg/policies/catalog.cedar"

# Only for a browser app calling the catalog directly; engines need none.
# "*" is refused in production mode.
# [server.cors]
# allowed_origins = ["https://dashboard.example.com"]
# allowed_methods = ["GET", "POST", "PUT", "DELETE", "PATCH", "HEAD", "OPTIONS"]
# allowed_headers = ["*"]

# ── TLS ──────────────────────────────────────────────────────────────────────
[tls]
enabled = false
# cert_path = "/etc/rustberg/tls/cert.pem"
# key_path  = "/etc/rustberg/tls/key.pem"
insecure_http = true   # development only

# ── Storage ──────────────────────────────────────────────────────────────────
[storage]
# The catalog database: a directory holding catalog.redb (one replica),
# postgres://… (any number of replicas), or "memory://" for tests.
catalog_url = "file:///var/lib/rustberg/data"

# Where table data and metadata live: file://, s3://, gs:// or abfss://.
# warehouse_location = "s3://my-bucket/warehouse"

# How far a client-supplied table location may point: "table" (default,
# <warehouse>/<namespace>/<name>) or "warehouse" (anywhere in it — then a
# writer of one table can obtain credentials for any prefix).
# location_scope = "table"

# How to reach the warehouse, by Iceberg property name. `env:NAME` reads a
# variable at startup; unset is a startup failure. Not needed for file://.
# [storage.properties]
# "s3.region"            = "eu-central-1"
# "s3.access-key-id"     = "env:RUSTBERG_S3_ACCESS_KEY_ID"
# "s3.secret-access-key" = "env:RUSTBERG_S3_SECRET_ACCESS_KEY"
# "s3.endpoint"          = "http://localhost:9000"   # MinIO, Ceph, R2
# "s3.path-style-access" = "true"
# "gcs.project-id"       = "my-project"
# "gcs.credentials-json" = "env:RUSTBERG_GCS_CREDENTIALS"
# "adls.account-name"    = "myaccount"
# "adls.account-key"     = "env:RUSTBERG_ADLS_ACCOUNT_KEY"

# ── Rate limiting ────────────────────────────────────────────────────────────
[rate_limit]
enabled = true
# Per client (IPv4 address, IPv6 /64); a tenant gets ten times this.
requests_per_second = 100
burst_size = 200
# Lock out an address after repeated *rejected* credentials (none at all does
# not count).
track_auth_failures = true
max_auth_failures = 5
lockout_duration_seconds = 300

# ── Logging (stderr) ─────────────────────────────────────────────────────────
[logging]
level = "info"            # a level, or a RUST_LOG filter; RUST_LOG overrides
json_format = false
with_span_events = true

# ── Audit (one JSON object per decision) ─────────────────────────────────────
[audit]
sink = "stdout"           # stdout | file | none — stdout carries audit records only
# path = "/var/log/rustberg/audit.jsonl"   # required for "file"
# Refuse a permitted mutation, credential or signature that could not be recorded.
fail_closed = true

# ── Storage access for engines ───────────────────────────────────────────────
# Engines ask with X-Iceberg-Access-Delegation: vended-credentials (a short-lived
# credential for one table) or remote-signing (no credential; every request is
# signed here). Leave this out if engines bring their own storage credentials.
[credentials]
provider = "none"         # none | aws | gcs | azure

# Prefixes a credential may ever be minted for. Default: every managed warehouse.
# Setting it replaces that list, mounts included.
# allowed_prefixes = ["s3://my-bucket/warehouse/public"]

# STS AssumeRole with an inline session policy scoped to the table.
# [credentials.aws]
# region   = "us-east-1"
# role_arn = "arn:aws:iam::123456789012:role/RustbergVending"
# external_id_env  = "RUSTBERG_STS_EXTERNAL_ID"   # cross-account; set-but-empty fails startup
# duration_seconds = 3600

# Credential Access Boundary token exchange.
# [credentials.gcs]
# service_account_key_path = "/etc/rustberg/gcp-service-account.json"

# User-delegation SAS scoped to the table; never an account key. The service
# principal needs Storage Blob Data Contributor (Reader for read-only).
# [credentials.azure]
# account           = "mystorageaccount"
# tenant_id         = "00000000-0000-0000-0000-000000000000"
# client_id         = "11111111-1111-1111-1111-111111111111"
# client_secret_env = "RUSTBERG_AZURE_CLIENT_SECRET"
# duration_seconds  = 3600

# Remote signing (POST …/tables/{table}/sign), S3-compatible storage only.
# Independent of `provider`; uses the same credentials and allowed_prefixes.
# [credentials.signing]
# enabled   = true
# region    = "us-east-1"     # when a client sends none
# url_style = "auto"          # auto | path | virtual-host; a wrong guess is refused
# endpoint_host = "minio:9000"
# presign_ttl_seconds = 900   # pre-signed URLs in restricted scan plans; keep it short

# ── Federation ───────────────────────────────────────────────────────────────
# A mount serves a top-level namespace from another catalog:
#   prod.analytics.events -> mount "prod", namespace analytics.events
# `owner` is authoritative for the whole mount. /v1/config advertises what every
# mount supports; renames and transactions across mounts are refused.
# [mount.prod]
# backend            = "native"
# catalog_url        = "postgres://user:pw@host/prod"  # or file:///path
# warehouse_location = "s3://prod-bucket/warehouse"
# owner              = "acme"
#
# [mount.legacy]
# backend            = "native"
# catalog_url        = "file:///var/lib/rustberg/legacy"
# warehouse_location = "s3://legacy-bucket/warehouse"
# owner              = "acme"
# read_only          = true      # refuse every mutation
#
# Another Iceberg REST catalog, read-only.
# [mount.partner]
# backend     = "rest"
# catalog_url = "https://catalog.partner.example"
# owner       = "acme"
# token_env   = "RUSTBERG_PARTNER_TOKEN"
