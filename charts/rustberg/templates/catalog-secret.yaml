{{- /*
Rendered only when an inline DSN is supplied and no Secret was named.

An inline DSN is stored in this Secret and in Helm's release history in
plaintext, which is why the values file marks it evaluation-only and why
existingSecret is the documented path.
*/ -}}
{{- if and (eq .Values.rustberg.catalog.backend "postgres") (not .Values.rustberg.catalog.postgres.existingSecret) .Values.rustberg.catalog.postgres.dsn }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rustberg.fullname" . }}-catalog-dsn
  labels:
    {{- include "rustberg.labels" . | nindent 4 }}
type: Opaque
stringData:
  dsn: {{ .Values.rustberg.catalog.postgres.dsn | quote }}
{{- end }}
