{{- include "rustberg.validateCatalog" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rustberg.fullname" . }}
  labels:
    {{- include "rustberg.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    {{- if eq .Values.rustberg.catalog.backend "redb" }}
    # Forced. redb holds an exclusive lock on the catalog file, so a rolling
    # update's new pod cannot start until the old one has exited. Recreate makes
    # that ordering explicit instead of stalling the rollout.
    type: Recreate
    {{- else }}
    {{- toYaml .Values.updateStrategy | nindent 4 }}
    {{- end }}
  selector:
    matchLabels:
      {{- include "rustberg.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "rustberg.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "rustberg.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      # Covers the in-process drain delay plus the drain itself. Rustberg keeps
      # serving for `shutdown.drainDelaySeconds` after SIGTERM so that its
      # removal from the Service's endpoints has time to propagate, then closes
      # in-flight requests. There is no preStop hook because the image is
      # distroless: no shell, nothing to run `sleep` in.
      terminationGracePeriodSeconds: {{ .Values.shutdown.terminationGracePeriodSeconds }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "rustberg.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "--host"
            - "{{ .Values.rustberg.server.host }}"
            - "--port"
            - "{{ .Values.rustberg.server.port }}"
            {{- if eq .Values.rustberg.catalog.backend "redb" }}
            - "--catalog-url"
            - "file://{{ .Values.rustberg.catalog.path }}"
            {{- end }}
            - "--warehouse"
            - "{{ include "rustberg.warehouseLocation" . }}"
            {{- if .Values.rustberg.config }}
            - "--config"
            - "/config/rustberg.toml"
            {{- end }}
            {{- if not .Values.rustberg.server.tls.enabled }}
            - "--insecure-http"
            {{- end }}
            - "--shutdown-delay"
            - "{{ .Values.shutdown.drainDelaySeconds }}"
          ports:
            - name: http
              containerPort: {{ .Values.rustberg.server.port }}
              protocol: TCP
          env:
            - name: RUST_LOG
              value: "info"
            {{- if eq .Values.rustberg.catalog.backend "postgres" }}
            # Read from a Secret rather than passed as an argument: process
            # arguments are visible to anything that can list processes, and the
            # DSN carries the database password.
            - name: RUSTBERG_CATALOG_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "rustberg.postgresSecretName" . }}
                  key: {{ include "rustberg.postgresSecretKey" . }}
            {{- end }}
            {{- include "rustberg.storageEnv" . | nindent 12 }}
            {{- with .Values.rustberg.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- if .Values.rustberg.config }}
            - name: config
              mountPath: /config
              readOnly: true
            {{- end }}
            {{- if .Values.persistence.enabled }}
            - name: data
              mountPath: /data
            {{- end }}
            {{- if and (eq .Values.rustberg.storage.type "gcs") .Values.rustberg.storage.gcs.existingSecret }}
            - name: gcp-credentials
              mountPath: /gcp
              readOnly: true
            {{- end }}
            {{- if .Values.rustberg.server.tls.enabled }}
            - name: tls
              mountPath: /certs
              readOnly: true
            {{- end }}
            - name: tmp
              mountPath: /tmp
      volumes:
        {{- if .Values.rustberg.config }}
        - name: config
          configMap:
            name: {{ include "rustberg.fullname" . }}-config
        {{- end }}
        {{- if .Values.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "rustberg.fullname" . }}-data
        {{- end }}
        {{- if and (eq .Values.rustberg.storage.type "gcs") .Values.rustberg.storage.gcs.existingSecret }}
        - name: gcp-credentials
          secret:
            secretName: {{ .Values.rustberg.storage.gcs.existingSecret }}
        {{- end }}
        {{- if .Values.rustberg.server.tls.enabled }}
        - name: tls
          secret:
            secretName: {{ .Values.rustberg.server.tls.certSecretName }}
        {{- end }}
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
