{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "rustberg.fullname" . }}
  labels:
    {{- include "rustberg.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "rustberg.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from ingress controller
    - ports:
        - port: {{ .Values.rustberg.server.port }}
          protocol: TCP
      {{- with .Values.networkPolicy.ingress.from }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  egress:
    # Allow DNS
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Allow HTTPS (OIDC, object storage, credential vending)
    - ports:
        - port: 443
          protocol: TCP
    {{- if eq .Values.rustberg.catalog.backend "postgres" }}
    # The catalog database. Without this the pod cannot reach its own catalog
    # and every request fails, so it is opened whenever the postgres backend is
    # selected. Narrow it with networkPolicy.egress.to if the database is at a
    # known address.
    - ports:
        - port: {{ .Values.networkPolicy.postgresPort | default 5432 }}
          protocol: TCP
    {{- end }}
    {{- with .Values.networkPolicy.egress.to }}
    {{- range . }}
    - {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- end }}
{{- end }}
