{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "rustberg.fullname" . }}
  labels:
    {{- include "rustberg.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "rustberg.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from ingress controller
    - ports:
        - port: {{ .Values.rustberg.server.port }}
          protocol: TCP
      {{- with .Values.networkPolicy.ingress.from }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  egress:
    # Allow DNS
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Allow HTTPS (for KMS, OIDC, etc.)
    - ports:
        - port: 443
          protocol: TCP
    {{- with .Values.networkPolicy.egress.to }}
    {{- range . }}
    - {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- end }}
{{- end }}
