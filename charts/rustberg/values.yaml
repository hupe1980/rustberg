# Default values for rustberg
# This is a YAML-formatted file.

# =============================================================================
# Image Configuration
# =============================================================================
image:
  repository: ghcr.io/hupe1980/rustberg
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# =============================================================================
# Replica Configuration
# =============================================================================
# With the postgres catalog backend, replicas share one registry and this can be
# raised freely. With redb it must stay at 1: redb holds an exclusive lock on the
# catalog file, so a second pod fails to start with "Database already open".
replicaCount: 2

# RollingUpdate is safe on postgres. The template switches this to Recreate
# automatically when the redb backend is selected, because a rolling update
# would briefly run two pods and the second could not open the file.
updateStrategy:
  type: RollingUpdate

# Autoscaling. Safe with the postgres backend; ignored with redb.
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# =============================================================================
# Rustberg Configuration
# =============================================================================
rustberg:
  # Server configuration
  server:
    host: "0.0.0.0"
    port: 8000
    # TLS configuration (optional)
    tls:
      enabled: false
      certSecretName: ""
      # certFile: /certs/tls.crt
      # keyFile: /certs/tls.key

  # Storage.
  #
  # Two distinct locations. The *catalog* is a redb file on the PersistentVolume
  # below and is never an object-store URL. The *warehouse* is where tables live
  # and may be any supported scheme.
  catalog:
    # Which registry holds namespaces, tables and views.
    #
    #   postgres - shared database; any number of replicas (default here)
    #   redb     - a file on the PersistentVolume; exactly one replica
    #
    # redb is the right choice for embedding and single-node installs, and the
    # wrong one for a cluster: redb locks the file, so a second pod fails to
    # start rather than sharing. If you are deploying to Kubernetes you almost
    # certainly want postgres.
    backend: "postgres"

    # Used when backend is "redb": directory on the mounted volume.
    path: "/data/catalog"

    postgres:
      # Where the catalog database is. Point this at a Secret holding the DSN:
      #   postgres://user:password@host:5432/rustberg
      #
      # This chart deliberately bundles no database. A Postgres subchart would
      # be a StatefulSet with no backups, no failover and no upgrade story —
      # everything a real deployment needs from its database, missing. Use a
      # managed instance (RDS, Cloud SQL, Azure Database) or an operator such as
      # CloudNativePG, and give Rustberg its DSN.
      existingSecret: ""
      existingSecretKey: "dsn"

      # Inline DSN. Evaluation only: it lands in the rendered manifest and in
      # Helm's release storage in plaintext.
      dsn: ""

  storage:
    # Credentials to give the server for warehouse access: none, s3, gcs, azure
    type: "none"
    
    # S3 configuration
    s3:
      bucket: ""
      region: "us-east-1"
      endpoint: ""  # For MinIO or LocalStack
      accessKeyId: ""
      secretAccessKey: ""
      # Use existing secret for credentials
      existingSecret: ""
      existingSecretAccessKeyIdKey: "access-key-id"
      existingSecretSecretAccessKeyKey: "secret-access-key"
    
    # GCS configuration
    gcs:
      bucket: ""
      projectId: ""
      # Service account key JSON (use existingSecret for production)
      serviceAccountKey: ""
      existingSecret: ""
      existingSecretKey: "credentials.json"
    
    # Azure configuration
    azure:
      container: ""
      accountName: ""
      accountKey: ""
      existingSecret: ""
      existingSecretKey: "account-key"

  # Warehouse location
  warehouse:
    location: "file:///data/warehouse"

  # Full Rustberg TOML config, mounted at /config/rustberg.toml and passed with
  # --config. Leave empty to configure entirely through the values above.
  config: ""

  # Extra environment variables for the container. This is where API key
  # secrets go: the config file names an environment variable, and the value
  # comes from a Secret.
  #
  # extraEnv:
  #   - name: RUSTBERG_KEY_SPARK
  #     valueFrom:
  #       secretKeyRef:
  #         name: rustberg-api-keys
  #         key: spark
  extraEnv: []

  # Authentication and authorization are configured through `config` above,
  # not through separate chart values. An earlier
  # version of this chart exposed `rustberg.auth.*` and
  # `rustberg.authorization.*` keys that no template ever read, so setting them
  # silently did nothing.
  #
  # config: |
  #   [server.auth]
  #   jwt_enabled = true
  #   policy_file = "/config/catalog.cedar"
  #
  #   [server.auth.jwt]
  #   issuer    = "https://auth.example.com"
  #   audiences = ["rustberg"]
  #   # jwks_url is discovered from the issuer; set it only to skip discovery.
  #
  # Credential vending is configured the same way. `storage.*` above gives the
  # SERVER its warehouse access; `[credentials]` is what lets it mint scoped,
  # short-lived credentials for CLIENTS. They are different things and either
  # may be used without the other.
  #
  # With IRSA, the pod's service account assumes the vending role, so no secret
  # is needed here:
  #
  # config: |
  #   [credentials]
  #   provider = "aws"
  #
  #   [credentials.aws]
  #   region   = "us-east-1"
  #   role_arn = "arn:aws:iam::123456789012:role/RustbergVending"
  #   duration_seconds = 3600

service:
  type: ClusterIP
  port: 8000
  annotations: {}

# =============================================================================
# Ingress Configuration
# =============================================================================
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: rustberg.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: rustberg-tls
  #    hosts:
  #      - rustberg.local

# =============================================================================
# Service Account
# =============================================================================
serviceAccount:
  create: true
  automount: true
  annotations: {}
    # eks.amazonaws.com/role-arn: arn:aws:iam::123456789:role/rustberg
  name: ""

# =============================================================================
# Pod Configuration
# =============================================================================
podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

# =============================================================================
# Resources
# =============================================================================
resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 64Mi

# =============================================================================
# Probes
# =============================================================================
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

# =============================================================================
# Shutdown
# =============================================================================
# Removing a pod from the Service's endpoints and sending it SIGTERM happen at
# the same time, and the removal still has to reach every kube-proxy and
# ingress. A server that stops accepting the instant it is signalled refuses
# whatever arrives in that window, and clients see connection errors on every
# rolling update.
#
# The usual fix is a preStop hook that sleeps, which cannot work here: the image
# is distroless and has no shell. Rustberg does the wait itself — it keeps
# serving for `drainDelaySeconds` after SIGTERM, then drains in-flight requests.
#
# terminationGracePeriodSeconds must cover the delay *plus* the drain, or the
# kubelet SIGKILLs the process partway through it.
shutdown:
  drainDelaySeconds: 5
  terminationGracePeriodSeconds: 60

# =============================================================================
# Persistence
# =============================================================================
# The catalog is a file on this volume. Disabling persistence means the catalog
# lives in the pod's writable layer and every table is lost when the pod
# restarts, so it is enabled by default and you should have a specific reason to
# turn it off.
# Only needed for the redb backend, which keeps the catalog on disk. With
# postgres the pods are stateless and this should stay disabled.
persistence:
  enabled: false
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 10Gi
  annotations: {}

# =============================================================================
# Scheduling
# =============================================================================
nodeSelector: {}

tolerations: []

affinity: {}

# Pod topology spread constraints
topologySpreadConstraints: []

# Pod disruption budget
podDisruptionBudget:
  enabled: false
  minAvailable: 1
  # maxUnavailable: 1

# =============================================================================
# Monitoring
# =============================================================================
serviceMonitor:
  enabled: false
  namespace: ""
  interval: 30s
  scrapeTimeout: 10s
  labels: {}
  annotations: {}

# =============================================================================
# Network Policies
# =============================================================================
networkPolicy:
  # Port the catalog database listens on, opened for egress when the
  # postgres backend is selected.
  postgresPort: 5432
  enabled: false
  ingress:
    # Allow traffic from these namespaces
    from: []
    # - namespaceSelector:
    #     matchLabels:
    #       name: data-platform
  egress:
    # Allow traffic to these destinations
    to: []
    # - namespaceSelector: {}
    #   podSelector:
    #     matchLabels:
    #       app: minio

