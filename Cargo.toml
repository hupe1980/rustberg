[package]
name = "rustberg"
version = "0.1.0"
edition = "2024"
authors = ["hupe1980"]
description = "A production-grade, cross-platform, single-binary Apache Iceberg REST Catalog"
readme = "README.md"
keywords = ["rustberg", "iceberg", "catalog", "lakehouse", "data"]
categories = ["database", "web-programming"]
license = "Apache-2.0"
repository = "https://github.com/hupe1980/rustberg"
homepage = "https://hupe1980.github.io/rustberg/"
# The floor the dependency tree imposes, not an aspiration: `iceberg` 0.10.1 and
# the AWS SDK both declare 1.94. `just msrv` checks this against a real
# toolchain — it was "1.89" while nothing in the tree could build on it.
rust-version = "1.94"

[features]
# Optional dependencies are referenced as `dep:name`. Without the prefix Cargo
# implicitly exposes each optional dependency as a public feature of the same
# name, so `--features aws-config` would be a supported knob we never intended
# and could not later rename. `dep:` keeps the feature surface exactly this list.
default = ["cli", "tls", "storage-all"]

# Command-line interface.
cli = ["dep:clap"]

# TLS termination, including self-signed certificate generation.
tls = ["axum-server/tls-rustls", "dep:rcgen", "dep:rustls"]

# Cloud object-store backends for table metadata (FileIO).
# The local filesystem and in-memory backends are always available.
storage-s3 = ["iceberg-storage-opendal/opendal-s3"]
storage-gcs = ["iceberg-storage-opendal/opendal-gcs"]
storage-azure = ["iceberg-storage-opendal/opendal-azdls"]
storage-all = ["storage-s3", "storage-gcs", "storage-azure"]

# Postgres-backed catalog.
#
# The embedded redb catalog is a single local file, and redb takes an exclusive
# lock on it, so a second process cannot start. That is right for embedding and
# wrong for Kubernetes; Postgres is what makes a multi-replica deployment
# possible, and it is the recommended backend there.
catalog-postgres = ["dep:sqlx"]

# Credential vending. Each performs a real downscoping exchange — STS
# AssumeRole with an inline session policy for S3, a Credential Access Boundary
# token exchange for GCS — so the caller receives a short-lived credential
# scoped to one table prefix, never the server's own rights.
aws-credentials = ["dep:aws-config", "dep:aws-sdk-sts"]
gcp-credentials = ["dep:google-cloud-auth"]
# Azure credential vending, via user-delegation SAS. Needs no Azure SDK: the
# Entra token and the delegation key are two ordinary HTTPS calls, and the SAS
# is an HMAC over a documented string.
azure-credentials = ["dep:hmac"]

# Remote request signing — the delegation form where the engine holds no
# storage credential at all and every object request is authorized and signed
# here. Stronger than vending and more expensive: one round trip per object
# instead of one credential per table.
#
# `aws-sigv4` is AWS's own signing crate rather than a reimplementation. The
# canonical request has a dozen ways to be subtly wrong and exactly one symptom
# — `SignatureDoesNotMatch`, naming no field — so this is the wrong place to
# save a dependency that is already in the tree under `aws-credentials`.
remote-signing = [
    "dep:aws-sigv4",
    "dep:aws-credential-types",
    "dep:aws-config",
]

[[bin]]
name = "rustberg"
path = "src/main.rs"
required-features = ["cli"]

[lib]
name = "rustberg"
path = "src/lib.rs"

[dependencies]
# Core async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
# Stream combinators. Scan planning collects `plan_files()`, which upstream
# returns as a stream.
futures = { version = "0.3", default-features = false, features = ["std"] }

# HTTP framework
axum = { version = "0.8", features = ["json", "tokio"] }
axum-server = { version = "0.8", default-features = false }
# Declared directly so `rustberg bench` can drive the router in-process and
# measure the same `loadTable` path the CI gate does. Already in the tree via
# axum and tower-http, so this adds no build cost.
tower = { version = "0.5", default-features = false, features = ["util"] }
tower-http = { version = "0.7", features = ["trace", "limit", "set-header", "timeout", "cors", "request-id", "compression-gzip", "compression-deflate"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

# Iceberg
#
# 0.10 split storage backends out of the core crate: `iceberg` itself only
# ships the local-filesystem and in-memory backends, and cloud object stores
# come from `iceberg-storage-opendal`. That split is what lets this build stay
# rustls-only — the old bundled `reqsign` pulled in native-tls/OpenSSL.
iceberg = "0.10"
iceberg-storage-opendal = { version = "0.10", default-features = false, features = [
    "opendal-memory",
    "opendal-fs",
] }

# Authentication & Security
jsonwebtoken = "11"
base64 = "0.23"
sha2 = "0.11"
# HMAC-SHA256, for signing Azure user-delegation SAS tokens. `sha2` provides
# the hash; HMAC is a separate construction and this is the RustCrypto
# implementation of it.
hmac = { version = "0.13", optional = true }
subtle = "2.6"   # Constant-time comparison for API key hashes
zeroize = { version = "1.8", features = ["derive"] }

# Authorization
cedar-policy = "4.12"

# Caching
moka = { version = "0.12", features = ["future", "sync"] }
dashmap = "6.2"

# Name validation. A table name becomes a path segment, a Cedar entity id and an
# audit field, so two names that render identically but differ in bytes are an
# authorization hazard rather than a cosmetic one — `catalog::v1::validation`.
# Both crates are already in the tree via `url`/`idna`, so this costs no build
# time; declaring them directly only makes the dependency visible.
#
# `default-features = false` on unicode-properties drops the emoji tables, which
# nothing here asks about.
unicode-normalization = "0.1"
unicode-properties = { version = "0.1", default-features = false, features = [
    "general-category",
] }

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.9"
thiserror = "2"
parking_lot = "0.12"

# HTTP client: JWKS fetching, the `rest` federated mount, and the OAuth2 token
# exchanges credential vending performs.
#
# `form` is what `RequestBuilder::form` needs, and it is declared here rather
# than inherited: the Entra token request in `credentials/azure.rs` is a
# `application/x-www-form-urlencoded` POST, and without this feature
# `--features azure-credentials` alone does not compile. It built under
# `--all-features` only because another dependency's feature unification
# switched it on — which is exactly the class of accident the feature matrix in
# CI exists to catch, and did not, because the matrix was never built.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "form"] }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# TLS (optional)
rcgen = { version = "0.14", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }

# Embedded catalog store
sqlx = { version = "0.8", optional = true, default-features = false, features = [
    "postgres",
    "runtime-tokio",
    "tls-rustls-ring",   # rustls, never native-tls
    "json",
] }
redb = "4"

# AWS SDK for credential vending (optional)
aws-config = { version = "1.10", optional = true }
# `default-features = false`, and the reason is a whole second TLS stack.
#
# `aws-sdk-sts`'s default feature set contains `rustls`, which despite the name
# is the *legacy* client: `aws-smithy-runtime/tls-rustls` → hyper 0.14, h2 0.3,
# rustls 0.21 and rustls-webpki 0.101 — none of which anything here calls, and
# all of which carried open advisories while the modern stack beside them was
# patched. `default-https-client` is the current path (hyper 1.x, rustls 0.23),
# and it is what `aws-config` itself defaults to; STS was the one crate in the
# tree still dragging the old one in.
#
# `sigv4a` is dropped with it: it signs for multi-region access points, and the
# only call made here is `AssumeRole` against a regional STS endpoint.
aws-sdk-sts = { version = "1.110", optional = true, default-features = false, features = [
    "default-https-client",
    "rt-tokio",
] }

# SigV4 request signing, for the `/sign` endpoint. AWS's own implementation:
# see the `remote-signing` feature for why this is not hand-rolled.
aws-sigv4 = { version = "1.5", optional = true }
aws-credential-types = { version = "1.3", optional = true }


# GCP SDK for credential vending (optional)
google-cloud-auth = { version = "1.15", optional = true }

# CLI (optional)
clap = { version = "4", features = ["derive", "env"], optional = true }

[dev-dependencies]
tempfile = "3"
axum-test = "17"
tokio = { version = "1", features = ["test-util", "macros"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
http = "1.1"
http-body-util = "0.1"
serial_test = "3.2"
testcontainers = "0.23"
tower = { version = "0.5", features = ["util"] }
futures = "0.3"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.release-debug]
inherits = "release"
debug = true
strip = false
