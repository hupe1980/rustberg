# `cargo audit` configuration — https://rustsec.org/
#
# This list must stay identical to the `[advisories] ignore` list in
# `deny.toml`, and every entry must name a crate that is genuinely in the
# dependency tree with a reason that is still true. An ignore list outlives the
# dependency it was written for: this file carried entries for `sled`, `foyer`,
# `slatedb`, `madsim`, `object_store` and the Azure SDK long after none of them
# were in the graph, which makes the list read as "six known problems we live
# with" when the real number was three. Check with `cargo tree -i <crate>`
# before adding one, and delete an entry the moment the crate leaves the tree.
#
# Nothing here is ignored because it was inconvenient. Four advisories that
# *were* on this list — h2 and rustls-webpki, reached through the AWS SDK's
# legacy hyper-0.14/rustls-0.21 client — turned out to be removable by turning
# that client off (`aws-sdk-sts`, `default-features = false`). The first
# question about an advisory is whether the dependency is needed at all.

[advisories]
ignore = [
    # quick-xml, via opendal's S3 and ADLS services. Both are denial-of-service
    # bounds on parsing untrusted XML, and opendal pins `^0.39`, so the fix is
    # upstream's to take. Rustberg hands quick-xml no attacker-controlled input:
    # the only XML it parses itself is a `DeleteObjects` body, read by a
    # restrictive scanner in `catalog::v1::sign` written partly to avoid an XML
    # library. What opendal parses is object-store responses from the store the
    # operator configured.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",

    # rsa, via reqsign's Azure storage signer. A timing side channel in RSA
    # decryption; reqsign uses it to sign requests with a key the operator
    # configured, not to decrypt attacker-supplied ciphertext. No fixed release
    # exists. Absent from any build without `storage-azure`.
    "RUSTSEC-2023-0071",

    # paste — unmaintained (no vulnerability), a proc macro reached through
    # parquet → iceberg. Runs at compile time only.
    "RUSTSEC-2024-0436",

    # rustls-pemfile — unmaintained (no vulnerability). **Dev-only**:
    # testcontainers → bollard. Not in any shipped binary.
    "RUSTSEC-2025-0134",

    # tokio-tar — PAX header parsing allows file smuggling during extraction.
    # **Dev-only**: testcontainers uses it to unpack the container images this
    # repository's own test suite pulls, which are trusted and named in the
    # tests. Nothing in a shipped binary extracts an archive at all. No fixed
    # release upstream.
    "RUSTSEC-2025-0111",
]

# Unmaintained crates are reported but do not fail the build; a real advisory
# does.
informational_warnings = ["unmaintained"]
