# Upstream documents this project's conformance claims are read from, pinned by
# content digest.
#
# # Why a digest and not the document
#
# The obvious design is to commit the documents and let CI `diff` them. It does
# not work here: the corpus lives in `concepts/references/`, which is gitignored
# because most of it is third-party material this repository may not
# redistribute — so a CI checkout has no copy to diff against. A digest is not a
# copy. It carries no licensed content, it is four lines per document, and it
# works the same for a permissively-licensed spec and for a vendor page that
# could never be committed.
#
# What it costs is the diff itself: a mismatch says a document moved, not what
# moved in it. The maintainer has the retrieved copy locally, so `just
# spec-check` names the file and `git diff --no-index` against a fresh fetch
# shows the change. Detecting drift is the job; reading it is a person's.
#
# # Why only these four
#
# Every entry must be a document whose bytes change *only* when its content
# does. These are raw Markdown and YAML served from a branch, so a change is a
# commit to the document.
#
# The rendered HTML pages in `concepts/references/` are deliberately absent.
# `iceberg.apache.org/spec/` re-renders on every site build, so pinning it would
# fire on a footer change and teach everyone to ignore the job — which is the
# failure this control exists to prevent, arriving one level up.
#
# # When this fires
#
# Read the change, decide whether it touches anything Rustberg implements or
# claims, then re-retrieve the corpus and run `just spec-pins` to re-stamp these
# digests. Updating a digest without reading the diff defeats the entire
# mechanism.

