# Apache's REST Compatibility Kit (RCK) against Rustberg: the pinned release,
# the behaviour flags this catalog's choices require, and every excluded test,
# each with its reason. Read by `just rck` and the `rck` CI jobs; published in
# site/content/docs/clients.md. A test is excluded by name or not at all.

# The release the kit is taken from.
iceberg.tag=apache-iceberg-1.12.0

# A table is created inside a namespace that exists; Rustberg answers 404 otherwise.
rck.requires-namespace-create=true
# Mutations accept the spec's Idempotency-Key and replay a retried request.
rck.supports-serverside-retry=true
# A requested location is honoured when it is inside the table's own prefix and
# refused otherwise; it is never silently moved.
rck.overrides-requested-location=false
# Names may contain dots: the namespace separator on the wire is the unit
# separator, so a dot is an ordinary character.
rck.supports-names-with-dot=true
# `variant` columns are served (0.4.0).
rck.supports-variant=true

# Excluded tests, by `Class.method`, each with its reason. An excluded test
# that fails is accepted; one that passes fails the run, so the list cannot go
# stale.
#
# testLoadTableWithMissingMetadataFile moves the metadata file away and expects
# the next load to fail. The client sends If-None-Match, and a conditional load
# is answered 304 from the registry pointer without opening the file — which is
# the point of conditional loading.
#
# createViewWithCustomMetadataLocation sets `write.metadata.path` and expects
# the view's metadata written there. The catalog's own writes always go to
# `<location>/metadata/`: the property would otherwise point them anywhere the
# catalog's storage role reaches.
rck.exclude=RESTCompatibilityKitCatalogTests.testLoadTableWithMissingMetadataFile,RESTCompatibilityKitViewCatalogTests.createViewWithCustomMetadataLocation
