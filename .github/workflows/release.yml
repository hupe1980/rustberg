name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  # ===========================================================================
  # Build Release Binaries
  # ===========================================================================
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Linux x86_64 (musl - static binary)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: rustberg-linux-x86_64
            musl: true
          # Linux ARM64 (musl - static binary)
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            artifact: rustberg-linux-aarch64
            zigbuild: true
          # macOS ARM64 (Apple Silicon)
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: rustberg-darwin-aarch64
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build the console
        working-directory: ui
        run: npm ci && npm run build

      - name: Install musl-tools
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Zig
        if: matrix.zigbuild
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild
        if: matrix.zigbuild
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Build release (native)
        if: "!matrix.zigbuild"
        env:
          RUSTBERG_REQUIRE_CONSOLE: "1"
        run: cargo build --release --all-features --target ${{ matrix.target }}

      - name: Build release (zigbuild)
        if: matrix.zigbuild
        env:
          RUSTBERG_REQUIRE_CONSOLE: "1"
        run: cargo zigbuild --release --all-features --target ${{ matrix.target }}

      - name: Package binary
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/rustberg dist/${{ matrix.artifact }}
          cd dist
          tar -czvf ${{ matrix.artifact }}.tar.gz ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.*

  # ===========================================================================
  # Build Docker Image
  # ===========================================================================
  docker:
    name: Docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===========================================================================
  # Create GitHub Release
  # ===========================================================================
  release:
    name: Release
    needs: [build, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Plain file names, so `sha256sum -c checksums.txt` works next to the downloads.
      - name: Generate checksums
        run: |
          cp artifacts/*/*.tar.gz .
          sha256sum rustberg-*.tar.gz > checksums.txt
          cat checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            rustberg-*.tar.gz
            checksums.txt

      - uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: checksums.txt

  # ===========================================================================
  # Homebrew: Formula/rustberg.rb in hupe1980/homebrew-tap (releases only)
  # ===========================================================================
  # Needs the GitHub environment `release` with HOMEBREW_APP_ID and
  # HOMEBREW_APP_PRIVATE_KEY: a GitHub App installed on the tap only, with
  # contents: write. Actions are pinned by commit because this job holds that token.
  tap:
    name: Homebrew tap
    needs: [release]
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: checksums
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ secrets.HOMEBREW_APP_ID }}
          private-key: ${{ secrets.HOMEBREW_APP_PRIVATE_KEY }}
          owner: hupe1980
          repositories: homebrew-tap
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: hupe1980/homebrew-tap
          token: ${{ steps.app-token.outputs.token }}
          path: tap
          persist-credentials: true
      - name: Update the formula
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p tap/Formula
          packaging/homebrew/formula.sh "$version" checksums.txt > tap/Formula/rustberg.rb
          cd tap
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "rustberg release"
            git config user.email "rustberg-release@users.noreply.github.com"
            git add Formula/rustberg.rb
            git commit -m "rustberg $version"
            git push
          fi

  # The published formula installs and passes its own test.
  brew:
    name: Homebrew install
    needs: [tap]
    runs-on: macos-latest
    steps:
      - run: |
          brew install hupe1980/tap/rustberg
          brew test rustberg
          [ "$(rustberg --version)" = "rustberg ${GITHUB_REF_NAME#v}" ]

  # ===========================================================================
  # Publish to crates.io, by Trusted Publishing: no token is stored. The job's
  # GitHub OIDC token is exchanged for a short-lived crates.io token that is
  # revoked when the job ends. crates.io → rustberg → Settings → Trusted
  # Publishing names this repository, `release.yml` and environment `release`.
  # ===========================================================================
  publish:
    name: Publish to crates.io
    needs: [release]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # The package carries ui/dist, so `cargo install` embeds the console without Node.
      - name: Build the console
        working-directory: ui
        run: npm ci && npm run build

      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          RUSTBERG_REQUIRE_CONSOLE: "1"
        # --allow-dirty: ui/dist is git-ignored build output the package includes on
        # purpose; the checkout is otherwise clean.
        run: cargo publish --locked --all-features --allow-dirty
