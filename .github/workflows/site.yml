name: Site

# The documentation site: built with Zola, published to GitHub Pages.
#
# Link checking runs on every pull request, so a documentation change that
# points at a page or an anchor that does not exist fails review rather than
# shipping a dead link. Only pushes to `main` deploy.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

env:
  ZOLA_VERSION: "0.23.2"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zola
        run: |
          curl -sSL "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /usr/local/bin zola

      # The base URL is pinned in config.toml for production. A pull-request
      # build only has to prove the site compiles and that its links resolve.
      - name: Build
        working-directory: site
        run: zola build

      # Every internal link is resolved at build time; this adds the external
      # ones and the anchors inside them. A dead link in documentation is a
      # reader who stops reading.
      - name: Check links
        working-directory: site
        run: zola check

      - name: Upload artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/public

  deploy:
    name: Deploy
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
