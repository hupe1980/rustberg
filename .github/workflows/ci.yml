name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  # Share cache across jobs with same lockfile
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

jobs:
  # Fast checks first - these gate everything else
  quick-checks:
    name: Quick Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          # Shared cache key for all ubuntu jobs
          shared-key: ubuntu-cargo
      - name: Rustfmt
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Documentation
        run: cargo doc --all-features --no-deps
        env:
          RUSTDOCFLAGS: -Dwarnings

  # Build once, test/reuse everywhere
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [quick-checks]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: ubuntu-cargo
      - name: Build debug binary
        run: cargo build --all-features
      - name: Upload debug binary
        uses: actions/upload-artifact@v4
        with:
          name: rustberg-debug
          path: target/debug/rustberg
          retention-days: 1

  # Every optional feature, on its own.
  #
  # Cargo features are additive and unify across a dependency graph, so a
  # feature that *happens* to compile under `--all-features` can be broken on its
  # own — some other crate's feature was switching on the thing it needed.
  # `--all-features` and `--no-default-features` are the two ends of the range
  # and neither catches the middle, which is where this lives.
  feature-matrix:
    name: Feature Matrix
    runs-on: ubuntu-latest
    needs: [quick-checks]
    strategy:
      fail-fast: false
      matrix:
        feature:
          - cli
          - tls
          - catalog-postgres
          - storage-s3
          - storage-gcs
          - storage-azure
          - aws-credentials
          - gcp-credentials
          - azure-credentials
          - remote-signing
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ubuntu-cargo
          save-if: false
      - name: Check ${{ matrix.feature }} alone
        run: cargo check --no-default-features --features ${{ matrix.feature }}

  # The declared MSRV, checked against a real toolchain. A version floor nothing
  # verifies drifts to whatever the newest dependency demands.
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    needs: [quick-checks]
    steps:
      - uses: actions/checkout@v4
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          echo "version=$(grep '^rust-version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: msrv-${{ steps.msrv.outputs.version }}
      - run: cargo check --all-features --all-targets

  test-linux:
    name: Test (Linux)
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ubuntu-cargo
          save-if: false  # Don't save, build job already did
      # Includes `cross_feature_tests`, which exercises pairs of features
      # together — four of five defects found in audit rounds lived in those
      # seams while every per-feature suite passed.
      - name: Run tests
        run: cargo test --all-features -- --skip trino_
      - name: Run tests (no default features)
        run: cargo test --no-default-features
      # Performance gate. These assert regression ceilings rather than the
      # design targets — a gate that flakes on a shared runner gets disabled,
      # and then it protects nothing. `--nocapture` so the measured numbers are
      # in the log whether or not the gate fires.
      - name: Performance gate
        run: |
          cargo test --release --all-features --test performance_tests \
            -- --ignored --nocapture --test-threads=1

  # Postgres catalog tests. Docker-only, so they are #[ignore]d by default and
  # run explicitly here — this is what gates multi-replica correctness.
  test-postgres-catalog:
    name: Postgres Catalog
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ubuntu-cargo
          save-if: false
      - name: Run Postgres catalog tests
        run: cargo test --features catalog-postgres --test postgres_catalog_tests -- --ignored
      # Two complete servers over one Postgres — the deployment shape, not just
      # the backend. Anything held in one process's memory passes every
      # single-node test and fails only here.
      - name: Clustered tests (two replicas)
        run: cargo test --features catalog-postgres --test clustered_tests -- --ignored

  # Trino integration tests - runs once using pre-built binary
  test-trino-integration:
    name: Trino Integration
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ubuntu-cargo
          save-if: false
      - name: Run Trino integration tests
        run: cargo test --all-features trino_

  test-macos:
    name: Test (macOS)
    runs-on: macos-latest
    needs: [quick-checks]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-cargo
      - name: Run tests
        run: cargo test --all-features -- --skip trino_

  test-windows:
    name: Test (Windows)
    runs-on: windows-latest
    needs: [quick-checks]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-cargo
      - name: Run tests
        run: cargo test --all-features -- --skip trino_

  # Python integration tests use pre-built binary
  test-python-integrations:
    name: Python Integrations
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rustberg-debug
          path: target/debug
      - name: Make binary executable and verify
        run: |
          chmod +x target/debug/rustberg
          ls -la target/debug/
          ./target/debug/rustberg --version
          ./target/debug/rustberg --help | head -5
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Install Python dependencies
        run: uv sync
      - name: Run PyIceberg tests
        run: uv run pytest tests/python/test_pyiceberg -v --tb=short
      - name: Run DuckDB tests
        run: uv run pytest tests/python/test_duckdb -v --tb=short -m duckdb
      # Scan planning against real Parquet, and a Cedar row filter pruning it.
      # Neither can be proved from Rust: the suite needs a client that writes
      # data files.
      - name: Run scan planning tests
        run: uv run pytest tests/python/test_policy_pruning.py -v --tb=short

  build-release:
    name: Build Release (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs: [test-linux, test-trino-integration]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: rustberg
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: rustberg
            musl: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            artifact: rustberg
            zigbuild: true
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: rustberg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: rustberg.exe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.os }}-release-${{ matrix.target }}
      - name: Install musl-tools
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Install Zig
        if: matrix.zigbuild
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0
      - name: Install cargo-zigbuild
        if: matrix.zigbuild
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - name: Build release (zigbuild)
        if: matrix.zigbuild
        run: cargo zigbuild --release --all-features --target ${{ matrix.target }}
      - name: Build release (native)
        if: ${{ !matrix.zigbuild }}
        run: cargo build --release --all-features --target ${{ matrix.target }}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustberg-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact }}

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test-linux, test-trino-integration]
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          platforms: linux/amd64,linux/arm64
          tags: rustberg:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # `--version` and `--help` prove the binary links. They do not prove the
      # image *starts*, which is a different question and the one that was
      # wrong: production mode refuses to run without an explicit catalog
      # location, so the image's own documented `docker run` exited immediately
      # while this job stayed green. The smoke test now starts a container the
      # way the README tells a reader to and waits for it to report ready.
      - name: Test Docker image
        run: |
          set -euo pipefail
          docker buildx build --platform linux/amd64 --load -t rustberg:test-amd64 .
          docker run --rm rustberg:test-amd64 --version
          docker run --rm rustberg:test-amd64 --help

          docker run -d --name rustberg-smoke -p 8000:8000 \
            -e RUSTBERG_INSECURE_HTTP=true rustberg:test-amd64
          # The image's own HEALTHCHECK is what a compose file and a swarm read,
          # so waiting on it tests the probe as well as the server.
          for _ in $(seq 1 30); do
            state=$(docker inspect -f '{{.State.Health.Status}}' rustberg-smoke)
            [ "$state" = "healthy" ] && break
            [ "$state" = "unhealthy" ] && break
            sleep 2
          done
          docker logs rustberg-smoke
          test "$(docker inspect -f '{{.State.Health.Status}}' rustberg-smoke)" = healthy
          # Authentication is on by default, so the catalog API answers 401 to
          # an anonymous caller. That is the assertion: a *401* proves the
          # router is serving, where a connection refused or a 500 would not.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/v1/config)
          echo "GET /v1/config -> $code"
          test "$code" = 401
          docker rm -f rustberg-smoke

  # Advisories, licences, bans and sources, all from `deny.toml` — one policy
  # file and one ignore list, rather than an audit action checking a subset of
  # the same database against a different one.
  cargo-deny:
    name: Dependency Policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          # Explicit rather than relying on the action's default, because the
          # `bans` list in deny.toml is what enforces "no OpenSSL under any
          # feature combination" — and it can only do that over a graph that
          # includes the optional dependencies.
          arguments: --all-features
          command: check advisories bans licenses sources

  helm-lint:
    name: Helm Chart Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'
      - name: Lint Helm chart
        run: helm lint charts/rustberg
      - name: Template Helm chart
        run: helm template rustberg charts/rustberg > /dev/null
      - name: Validate Helm chart
        run: |
          helm template rustberg charts/rustberg | kubectl apply --dry-run=client -f - 2>/dev/null || true

  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    needs: [test-linux, test-trino-integration]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ubuntu-cargo
          save-if: false
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y hyperfine valgrind
      - name: Build release
        run: cargo build --release --all-features
      - name: Measure startup time
        run: |
          echo "=== Startup Time Benchmark ==="
          hyperfine --warmup 3 --runs 10 './target/release/rustberg --help' --export-markdown startup-bench.md
          cat startup-bench.md
      - name: Measure binary size
        run: |
          echo "=== Binary Size ==="
          ls -lh target/release/rustberg
          du -h target/release/rustberg
      - name: Check for memory leaks
        run: valgrind --leak-check=full --error-exitcode=1 ./target/release/rustberg generate-config > /dev/null

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: [quick-checks]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ubuntu-cargo
          save-if: false
      - uses: taiki-e/install-action@v2
        with:
          tool: grcov
      - name: Run tests with coverage
        run: |
          CARGO_INCREMENTAL=0 RUSTFLAGS='-Cinstrument-coverage' LLVM_PROFILE_FILE='cargo-test-%p-%m.profraw' cargo test --all-features -- --skip trino_
      - name: Generate coverage report
        run: |
          grcov . --binary-path ./target/debug/deps/ -s . -t lcov --branch --ignore-not-existing --ignore '../*' --ignore "/*" -o coverage.lcov
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage.lcov
          fail_ci_if_error: false
