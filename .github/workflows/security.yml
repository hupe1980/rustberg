name: Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run security audit daily at 6:00 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ===========================================================================
  # Advisories, on a schedule
  # ===========================================================================
  # The same tool and the same ignore list the pull-request gate uses
  # (`deny.toml`), run daily. That is what this job is for: an advisory published
  # today applies to a tree nobody has pushed to, so it has to be found by the
  # clock rather than by a commit.
  #
  # One tool over the RustSec database, not two. A second one means a second
  # ignore list to keep identical by hand, and the entry that gets forgotten is
  # the one that matters.
  advisories:
    name: Advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          arguments: --all-features
          command: check advisories

  # ===========================================================================
  # Secret Scanning
  # ===========================================================================
  secrets:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ""
          head: ${{ github.ref_name }}
          extra_args: --only-verified

  # ===========================================================================
  # Dependency Review (PRs only)
  # ===========================================================================
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-3.0, AGPL-3.0

  # ===========================================================================
  # Upstream specification drift, on the same schedule and for the same reason
  # ===========================================================================
  # The REST OpenAPI document carries no version (`version: 0.0.1`, unchanged),
  # lives on a branch, and produces no release event — so there is nothing to
  # subscribe to, and six fields have landed in it without these notes noticing.
  # Like an advisory, a spec change applies to a tree nobody has pushed to, so it
  # has to be found by the clock rather than by a commit.
  #
  # Scheduled runs only. On a pull request this would fail for a reason the
  # author did not cause and cannot fix in their branch, which is how a required
  # check gets marked non-blocking and stops being read.
  spec-drift:
    name: Specification Drift
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Diff pinned upstream documents
        run: ./.github/spec-drift.sh
