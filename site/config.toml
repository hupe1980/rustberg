base_url = "https://hupe1980.github.io/rustberg"
title = "Rustberg"
description = "The policy layer for Apache Iceberg. One authenticated, policy-controlled Iceberg REST endpoint in front of every catalog you own — a single Rust binary, and an embeddable crate."
default_language = "en"
author = "hupe1980"

compile_sass = true
build_search_index = true
generate_feeds = true
feed_filenames = ["atom.xml"]

# Every page is written as one document; `taxonomies` would add index pages
# nobody links to.
taxonomies = []

[markdown]
render_emoji = false
external_links_target_blank = true
external_links_no_referrer = true
smart_punctuation = false
bottom_footnotes = true
# GitHub-style `> [!NOTE]` callouts, so a warning in the source renders as one.
github_alerts = true

[markdown.highlighting]
# `css` emits classes rather than inline colours, so one highlighted block can
# follow the reader's light/dark preference like everything else on the page.
style = "class"
light_theme = "ayu-light"
dark_theme = "ayu-dark"
add_color_scheme = true

[search]
# The JavaScript form assigns `window.searchIndex`, so the page needs no fetch
# and search keeps working from a `file://` preview.
index_format = "elasticlunr_javascript"
include_title = true
include_description = true
include_path = true
include_content = true

[extra]
# Repository, used for edit links and the header button.
repo = "https://github.com/hupe1980/rustberg"
repo_name = "hupe1980/rustberg"
license = "Apache-2.0"

# Social card. Regenerated by hand; see static/og.svg.
og_image = "/og.png"

# The one-line claim the whole site is arranged around.
tagline = "The policy layer for Apache Iceberg"

# Order of the documentation sidebar. Pages carry `weight`, and the groups here
# name which weights belong together — a flat sixteen-item list is a list
# nobody reads to the end of.
[[extra.nav]]
title = "Start here"
pages = ["getting-started", "architecture"]

[[extra.nav]]
title = "Governance"
pages = ["authentication", "authorization", "security", "encryption"]

[[extra.nav]]
title = "Catalogs & storage"
pages = ["storage", "federation", "api"]

[[extra.nav]]
title = "Run it"
pages = ["configuration", "kubernetes", "clients", "library"]

[[extra.nav]]
title = "Reference"
pages = ["benchmarks", "troubleshooting"]
