# The client conformance suites (tests/python). `just test-clients` runs them.

[project]
name = "rustberg-tests"
version = "0.1.0"
description = "Client conformance tests for the Rustberg Iceberg REST catalog"
readme = "tests/python/README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0 OR MIT" }

dependencies = [
    # pyiceberg-core: needed to write tables partitioned by anything but identity.
    "pyiceberg[pyiceberg-core]>=0.10.0",
    "duckdb>=1.2.0",
    "pyarrow>=18.0.0",
    "pytest>=9.0.0",
    "pytest-timeout>=2.4.0",
    "httpx>=0.28.0",
]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
timeout = 300
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "pyiceberg: marks tests using PyIceberg client",
    "duckdb: marks tests using DuckDB client",
]
