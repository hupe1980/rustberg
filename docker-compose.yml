# =============================================================================
# Docker Compose for Rustberg Iceberg Catalog
# =============================================================================
#
# Production (default - authentication enabled):
#   docker-compose up -d
#
# Development (no auth, for local testing only):
#   docker-compose --profile dev up -d
#
# With MinIO storage (brings up MinIO, creates the bucket, and starts a
# catalog configured against it — see examples/minio.toml):
#   docker-compose --profile storage up -d
#
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Rustberg Catalog Server (Production Mode - Auth Enabled)
  # ---------------------------------------------------------------------------
  rustberg:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      RUSTBERG_HOST: "0.0.0.0"
      RUSTBERG_PORT: "8000"
      RUSTBERG_INSECURE_HTTP: "true"
      # Production mode requires an explicit catalog location, so metadata is
      # never written to a temp directory that disappears on restart. This points
      # at the persistent volume mounted below.
      RUSTBERG_CATALOG_URL: "file:///var/lib/rustberg/data"
      RUSTBERG_WAREHOUSE: "/var/lib/rustberg/warehouse"
      # Authentication is enabled by default (no RUSTBERG_NO_AUTH). With no keys
      # configured, Rustberg mints an admin key at startup and prints it:
      #   docker compose logs rustberg | grep X-API-Key
      # It is held in memory, so restarting the container mints a new one.
      RUST_LOG: "info"
    volumes:
      - rustberg-data:/var/lib/rustberg/data
      - rustberg-warehouse:/var/lib/rustberg/warehouse
    # The image is distroless — no shell, no curl — so the binary probes itself.
    # `healthcheck` reads /ready, which reports whether the catalog store and the
    # policy set are usable rather than merely that the process is alive.
    healthcheck:
      test: ["CMD", "/usr/local/bin/rustberg", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Rustberg Development Mode (No Auth - FOR LOCAL TESTING ONLY)
  # ---------------------------------------------------------------------------
  rustberg-dev:
    build:
      context: .
      dockerfile: Dockerfile
    profiles:
      - dev
    ports:
      - "8000:8000"
    environment:
      RUSTBERG_HOST: "0.0.0.0"
      RUSTBERG_PORT: "8000"
      RUSTBERG_INSECURE_HTTP: "true"
      RUSTBERG_NO_AUTH: "true"  # Explicitly disable auth for development
      RUSTBERG_CATALOG_URL: "file:///var/lib/rustberg/data"
      RUSTBERG_WAREHOUSE: "/var/lib/rustberg/warehouse"
      RUST_LOG: "debug"
    volumes:
      - rustberg-dev-data:/var/lib/rustberg/data
      - rustberg-dev-warehouse:/var/lib/rustberg/warehouse
    # The image is distroless — no shell, no curl — so the binary probes itself.
    # `healthcheck` reads /ready, which reports whether the catalog store and the
    # policy set are usable rather than merely that the process is alive.
    healthcheck:
      test: ["CMD", "/usr/local/bin/rustberg", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ---------------------------------------------------------------------------
  # MinIO for S3-compatible object storage
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    profiles:
      - storage
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Creates the warehouse bucket, then exits. Without it the first table write
  # fails against a bucket that does not exist, which reads as a credential
  # problem and is not one.
  minio-init:
    image: minio/mc:latest
    profiles:
      - storage
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 minioadmin minioadmin &&
             mc mb --ignore-existing local/warehouse"

  # ---------------------------------------------------------------------------
  # Rustberg against MinIO
  # ---------------------------------------------------------------------------
  #
  # The MinIO service on its own is not a working storage deployment: the
  # catalog has to be told the endpoint. Virtual-host addressing needs DNS MinIO
  # does not have, so path-style is required.
  rustberg-storage:
    build:
      context: .
      dockerfile: Dockerfile
    profiles:
      - storage
    ports:
      - "8000:8000"
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      RUSTBERG_HOST: "0.0.0.0"
      RUSTBERG_PORT: "8000"
      RUSTBERG_INSECURE_HTTP: "true"
      RUSTBERG_CATALOG_URL: "file:///var/lib/rustberg/data"
      RUSTBERG_CONFIG: "/etc/rustberg/config.toml"
      # The config file names these rather than holding them, so the same file
      # is committable. A named variable that is unset is a startup failure.
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - ./examples/minio.toml:/etc/rustberg/config.toml:ro
      - rustberg-storage-data:/var/lib/rustberg/data
    # The image is distroless — no shell, no curl — so the binary probes itself.
    # `healthcheck` reads /ready, which reports whether the catalog store and the
    # policy set are usable rather than merely that the process is alive.
    healthcheck:
      test: ["CMD", "/usr/local/bin/rustberg", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  rustberg-data:
  rustberg-dev-data:
  rustberg-warehouse:
  rustberg-dev-warehouse:
  rustberg-storage-data:
  minio-data:

# =============================================================================
# Usage Examples:
#
# 1. Start production server (with authentication):
#    docker-compose up -d
#
# 2. Start development server (no authentication):
#    docker-compose --profile dev up -d
#
# 3. Start with MinIO storage:
#    docker-compose --profile storage up -d
#    MinIO console: http://localhost:9001 (minioadmin/minioadmin)
#
# 4. Generate an API key (production). The image is distroless, so there is no
#    shell — `exec` runs the binary directly:
#    docker compose exec rustberg rustberg generate-key --name admin --roles admin
#
# 5. Back up the catalog. There is no backup subcommand: the redb file is one
#    file, so a copy taken while nothing is writing to it is the backup. Stop
#    the container first — redb holds an exclusive lock and a copy taken during
#    a commit is a copy of a half-written file:
#    docker compose stop rustberg && docker run --rm \
#      -v rustberg_rustberg-data:/data -v "$PWD:/out" busybox \
#      cp /data/catalog.redb /out/catalog.redb && docker compose start rustberg
#    A Postgres-backed deployment uses `pg_dump`, which needs no downtime.
#
# 6. View logs:
#    docker compose logs -f rustberg
#
# 7. Check health. The container checks itself every ten seconds
#    (`docker compose ps` shows the result); from outside:
#    curl http://localhost:8000/health   # the process is up
#    curl http://localhost:8000/ready    # the catalog and policy set are usable
#
# Security Notes:
# - Production mode (default) requires API key authentication
# - Development mode (--profile dev) disables auth - NEVER use in production
# - Configure [[server.auth.api_keys]] rather than relying on the minted key
# - Consider enabling TLS for production deployments
#
# =============================================================================
