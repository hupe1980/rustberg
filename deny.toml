# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

# ===========================================================================
# Advisories - Security vulnerability database checking
# ===========================================================================
[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]

# Advisories in transitive dependencies that this crate cannot resolve by
# updating. Each names the crate, the path in, and why it is tolerable here —
# an ignore with no reason is one nobody can re-evaluate later.
ignore = [
    # quick-xml, via opendal's S3 and ADLS services. Both are denial-of-service
    # bounds on parsing untrusted XML. Rustberg does not hand it any: the only
    # XML it parses is a `DeleteObjects` body, read by a scanner of its own
    # (`catalog::v1::sign`) that exists partly to avoid this dependency. What
    # opendal parses is object-store responses from the store the operator
    # configured.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
    # rsa, via reqsign's Azure storage signer. A timing side channel in RSA
    # decryption; reqsign uses it to sign requests with a key the operator
    # configured, not to decrypt attacker-supplied ciphertext. Removed with
    # `--no-default-features` builds that omit `storage-azure`.
    "RUSTSEC-2023-0071",
    # paste, a proc-macro crate, via `parquet` inside `iceberg`. Unmaintained
    # rather than vulnerable, and it runs at compile time only.
    "RUSTSEC-2024-0436",
    # rustls-pemfile (unmaintained) and tokio-tar (a tar-extraction flaw), both
    # via `testcontainers`. Dev-dependencies: they reach the test suite pulling
    # container images and never the server.
    "RUSTSEC-2025-0134",
    "RUSTSEC-2025-0111",
]

# ===========================================================================
# Licenses - Allowed license checking
# ===========================================================================
[licenses]
confidence-threshold = 0.8

# List of allowed licenses
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "OpenSSL",                          # aws-lc-sys
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",                      # icu4x crates (yoke, zerofrom, zerovec, etc.)
    "CDLA-Permissive-2.0",              # webpki-roots
    "BSL-1.0",
]

# Crates with clarifications
[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 },
]

[[licenses.clarify]]
name = "webpki"
expression = "ISC"
license-files = [
    { path = "LICENSE", hash = 0x001c7e6c },
]

# ===========================================================================
# Bans - Dependency bans and duplicates
# ===========================================================================
[bans]
multiple-versions = "warn"
wildcards = "allow"  # Cargo doesn't support workspace inheritance with wildcards well
highlight = "all"

# Deny specific problematic crates
deny = [
    # Example: { name = "openssl" }  # Prefer rustls
]

# Allow specific duplicates (with justification)
skip = [
    # Common crates that often have multiple versions
    # { name = "syn" },
]

# Skip tree for specific crates' dependencies
skip-tree = [
    # { name = "some-crate", version = "*" },
]

# ===========================================================================
# Sources - Allowed registry sources
# ===========================================================================
[sources]
unknown-registry = "deny"
unknown-git = "deny"

# Allow crates.io (default)
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

# Allow specific git repositories (if needed)
allow-git = []

# ===========================================================================
# Output - How results are presented
# ===========================================================================
[output]
feature-depth = 1
